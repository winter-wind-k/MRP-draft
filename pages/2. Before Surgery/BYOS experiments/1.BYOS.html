<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="byos-styles.css">
</head>

<body>

    <div>
        <h1>BYOS tool functionality</h1>
    </div>

    <div>
        <p>Task 1: toggle switch</p>

        <!--https://www.w3schools.com/howto/howto_css_switch.asp-->

        <label class="switch">
            <input type="checkbox">
            <span class="slider round"></span>
        </label>
    </div>

    <div>
        <p>Task 2: moveable labels over image</p>
    </div>

    <!--https://www.w3schools.com/howto/howto_css_image_text.asp-->

    <div class="container">
        <img src="images/VT_image2_003.jpg" alt="sagittal section of pelvis anatomy">
        <div class="bottom-left">Bottom Left</div>
        <div class="top-left">Top Left</div>
        <div class="top-right">Top Right</div>
        <div class="bottom-right">Bottom Right</div>
        <div class="centered">Centered</div>
    </div>

    <div>
        <p>Moving text</p>

        <div class="moveable-text">

            <div class="left-image">
                <div class="container2">
                    <img src="images/VT_image2_003.jpg" alt="sagittal section of pelvis anatomy">
                    <div class="bottom-left2">Bottom Left</div>
                    <div class="top-left2">Top Left</div>
                    <div class="top-right2">Top Right</div>
                    <div class="bottom-right2">Bottom Right</div>
                    <div class="centered2">Centered</div>
                </div>
            </div>

        </div>

    </div>

    <div>
        <p>Task 3: toggle shows/hides labels</p>
    </div>

</body>

</html>
